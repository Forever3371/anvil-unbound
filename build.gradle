plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // JEI 的发布仓库。这里只用于编译期引用它的类（compileOnly），
    // 玩家不需要安装它；没装 JEI 时对应的 Mixin 会被 MixinConfigPlugin 直接跳过。
    exclusiveContent {
        forRepository {
            maven {
                name = "BlameJared"
                url = "https://maven.blamejared.com"
            }
        }
        filter {
            includeGroup "mezz.jei"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // JEI 只是"可能装了"的第三方模组：用 compileOnly 让 Mixin 注解处理器能解析目标类，
    // 既不会打进我们的 jar，也不会变成玩家必须安装的依赖。
    // transitive = false：我们只引用 JEI 自己的类，它的传递依赖（mezz_config 等）在别的仓库，
    // 没必要为了编译去拉一整条依赖链。
    compileOnly("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}") {
        transitive = false
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// 独立的 gametest 源集：./gradlew runGameTest 会在无头服务端里跑 src/gametest 下的测试
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "anvil-unbound-test"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}
